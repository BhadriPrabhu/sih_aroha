server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: aroha-remote-server

  datasource:
    url: jdbc:h2:mem:aroha_remote_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    com.nullhypothesis.aroha: DEBUG
    org.hibernate.SQL: DEBUG
